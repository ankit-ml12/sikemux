[package]
name = "sikemux-gpui"
version = "0.1.0"
edition = "2021"
publish = false
description = "The desktop UI on GPUI, a client of the core"

# Its own workspace, so GPUI stays out of the app's lockfile and workspace-hack.
[workspace]
members = ["crates/*"]

# The core trusts the program named this beside it as its app.
[[bin]]
name = "sikemux"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
# The same GPUI as GPUI Kit's, named `gpui` for the macros that expand to it.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["component"] }
gpui-transcript = { path = "crates/gpui-transcript", features = ["fork"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sikemux-core = { path = "../sikemux-core" }
sikemux-host = { path = "../sikemux-host", default-features = false }
sikemux-process = { path = "../sikemux-process" }
sikemux-client = { path = "../sikemux-client" }
sikemux-wire = { path = "../sikemux-wire" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
anyhow = "1"
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support", "bench-support"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Layout and drawing run every frame.
[profile.release.package.gpui-pre]
opt-level = 3
[profile.release.package.gpui-pre-apple]
opt-level = 3
[profile.release.package.gpui-pre-macos]
opt-level = 3
[profile.release.package.taffy]
opt-level = 3
[profile.release.package.gpui-transcript]
opt-level = 3

# GPUI from our fork of sonorahq/gpui, published under the gpui-pre names GPUI Kit pins.
[patch.crates-io]
gpui-pre = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-apple = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-collections = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-derive-refineable = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-http-client = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-linux = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-macos = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-macros = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-platform = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-refineable = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-scheduler = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-shared-string = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-sum-tree = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-util = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-wgpu = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-windows = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-ztracing = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
gpui-pre-ztracing-macro = { git = "https://github.com/sikemux/gpui", rev = "50262805ba36b5465677c8c0adbc91625bd606ab" }
