gpui-pre-linux = { git = "https://github.com/sikemux/gpui", rev = "bd0747139ec6b0f824ca159a38c6319fce4eb0e1" }
gpui-pre-macos = { git = "https://github.com/sikemux/gpui", rev = "bd0747139ec6b0f824ca159a38c6319fce4eb0e1" }
gpui-pre-macros = { git = "https://github.com/sikemux/gpui", rev = "bd0747139ec6b0f824ca159a38c6319fce4eb0e1" }
