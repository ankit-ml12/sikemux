[package]
name = "sikemux-gpui"
version = "0.1.0"
edition = "2021"
publish = false
description = "The desktop UI on GPUI, a client of the core"

# Its own workspace, so GPUI stays out of the app's lockfile and workspace-hack.
[workspace]
exclude = ["target"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["component"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sikemux-client = { path = "../sikemux-client" }
sikemux-wire = { path = "../sikemux-wire" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Layout and drawing run every frame.
[profile.release.package.gpui-pre]
opt-level = 3
[profile.release.package.gpui-pre-apple]
opt-level = 3
[profile.release.package.gpui-pre-macos]
opt-level = 3
[profile.release.package.taffy]
opt-level = 3

# Run fork.mjs first: it checks out the sonorahq fork under the names below.
[patch.crates-io]
gpui-pre = { path = "target/gpui-fork/crates/gpui" }
gpui-pre-apple = { path = "target/gpui-fork/crates/gpui_apple" }
gpui-pre-collections = { path = "target/gpui-fork/crates/collections" }
gpui-pre-derive-refineable = { path = "target/gpui-fork/crates/refineable/derive_refineable" }
gpui-pre-http-client = { path = "target/gpui-fork/crates/http_client" }
gpui-pre-linux = { path = "target/gpui-fork/crates/gpui_linux" }
gpui-pre-macos = { path = "target/gpui-fork/crates/gpui_macos" }
gpui-pre-macros = { path = "target/gpui-fork/crates/gpui_macros" }
gpui-pre-platform = { path = "target/gpui-fork/crates/gpui_platform" }
gpui-pre-refineable = { path = "target/gpui-fork/crates/refineable" }
gpui-pre-scheduler = { path = "target/gpui-fork/crates/scheduler" }
gpui-pre-shared-string = { path = "target/gpui-fork/crates/gpui_shared_string" }
gpui-pre-sum-tree = { path = "target/gpui-fork/crates/sum_tree" }
gpui-pre-util = { path = "target/gpui-fork/crates/gpui_util" }
gpui-pre-wgpu = { path = "target/gpui-fork/crates/gpui_wgpu" }
gpui-pre-windows = { path = "target/gpui-fork/crates/gpui_windows" }
gpui-pre-ztracing = { path = "target/gpui-fork/crates/ztracing" }
gpui-pre-ztracing-macro = { path = "target/gpui-fork/crates/ztracing_macro" }
