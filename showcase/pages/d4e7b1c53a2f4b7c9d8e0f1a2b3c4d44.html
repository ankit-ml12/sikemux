<!doctype html><html><head><meta charset="utf-8" /><style>
:root { color-scheme: dark; }
html { background: transparent; color: #e7e5ef; font: 14px/1.5 Figtree, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { margin: 0; padding: 4px 2px 10px; }
h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.sub { margin: 0 0 16px; color: #a9a5b6; font-size: 13px; }
.card { border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: rgba(255,255,255,.035); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.stat { padding: 10px 14px; }
.stat b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.stat span { font-size: 12px; color: #8b8898; }
.good { color: #61ffca; }
.chart { padding: 14px 12px 8px; }
.key { display: flex; gap: 16px; margin: 0 0 6px 40px; font-size: 12px; color: #a9a5b6; }
.key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
svg text { font: 11px -apple-system, system-ui, sans-serif; fill: #8b8898; }
</style></head><body>
<h1>Palette distance from the hand-picked references</h1>
<p class="sub">ΔE in OKLab across the 240-image set, lower is closer. One bar a category.</p>
<div class="stats">
  <div class="card stat"><span>k-means, mean ΔE</span><b class="good">4.1</b></div>
  <div class="card stat"><span>median-cut, mean ΔE</span><b>7.3</b></div>
  <div class="card stat"><span>cost at p50</span><b>+25 ms</b></div>
</div>
<div class="card chart">
<div class="key"><span><i style="background:#a277ff"></i>k-means in OKLab</span><span><i style="background:#5c5874"></i>median-cut</span></div>
<svg viewBox="0 0 740 210" width="100%">
  <g stroke="rgba(255,255,255,.07)"><path d="M40 20H720M40 72H720M40 124H720M40 176H720"/></g>
  <text x="34" y="24" text-anchor="end">12</text><text x="34" y="76" text-anchor="end">8</text><text x="34" y="128" text-anchor="end">4</text><text x="34" y="180" text-anchor="end">0</text>
  <g fill="#5c5874">
    <rect x="70" y="72" width="34" height="104" rx="3"/>
    <rect x="200" y="98" width="34" height="78" rx="3"/>
    <rect x="330" y="59" width="34" height="117" rx="3"/>
    <rect x="460" y="111" width="34" height="65" rx="3"/>
    <rect x="590" y="46" width="34" height="130" rx="3"/>
  </g>
  <g fill="#a277ff">
    <rect x="108" y="124" width="34" height="52" rx="3"/>
    <rect x="238" y="137" width="34" height="39" rx="3"/>
    <rect x="368" y="111" width="34" height="65" rx="3"/>
    <rect x="498" y="143" width="34" height="33" rx="3"/>
    <rect x="628" y="111" width="34" height="65" rx="3"/>
  </g>
  <text x="106" y="198" text-anchor="middle">Interiors</text><text x="236" y="198" text-anchor="middle">Portraits</text><text x="366" y="198" text-anchor="middle">Night</text><text x="496" y="198" text-anchor="middle">Product</text><text x="626" y="198" text-anchor="middle">Florals</text>
</svg>
</div>
<script>
const post = () => parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: Math.ceil(document.documentElement.getBoundingClientRect().height) } }, "*");
new ResizeObserver(post).observe(document.documentElement); addEventListener("load", post);
</script></body></html>
